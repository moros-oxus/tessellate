<div id="app">
  <h2>Tessellate</h2>
  <p class="hint">
    Drop a <code>figma.model.json</code> (from <code>vertekum build</code>) or
    <label class="pick">choose a file<input id="pick" type="file" accept=".json" /></label>
  </p>
  <p class="hint"><span id="file-name"></span></p>
  <label class="hint"
    ><input id="limited" type="checkbox" /> limited-modes seat (split collections)</label
  >
  <div id="summary" class="summary">no model loaded</div>
  <div id="report" class="report"></div>
  <ul id="notes" class="notes"></ul>
  <div id="detail" class="detail"></div>
  <button id="apply" type="button" disabled>Apply</button>
</div>
<style>
  body { font: 11px/1.5 -apple-system, system-ui, sans-serif; margin: 0; padding: 12px; }
  h2 { margin: 0 0 8px; font-size: 13px; }
  .hint { color: #555; margin: 4px 0; }
  .pick input { display: none; }
  .pick { text-decoration: underline; cursor: pointer; }
  .summary { margin: 10px 0 6px; }
  .report { color: #c92a2a; margin: 4px 0; }
  .report ul { padding-left: 14px; margin: 2px 0; }
  .notes { color: #777; padding-left: 16px; margin: 4px 0; }
  .detail { max-height: 320px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 6px; }
  .detail ul { padding-left: 14px; margin: 4px 0; }
  .badge { border-radius: 3px; padding: 0 4px; font-size: 10px; color: #fff; }
  .badge.add { background: #2f9e44; }
  .badge.update { background: #1971c2; }
  .badge.drift { background: #e8590c; }
  .badge.unchanged { background: #adb5bd; }
  button { margin-top: 10px; padding: 6px 14px; }
  code { font-size: 10px; }
</style>
<script>/*UI_SCRIPT*/</script>
